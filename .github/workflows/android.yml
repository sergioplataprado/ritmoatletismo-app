# Compila la app Android de RitmoAtletismo y la publica con un enlace fijo:
#   https://github.com/<usuario>/<repo>/releases/latest/download/RitmoAtletismo.apk
name: APK Android
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: npx cap add android
      - run: node scripts/patch-android.mjs
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk RitmoAtletismo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RitmoAtletismo-android
          path: RitmoAtletismo.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: RitmoAtletismo Android ${{ github.run_number }}
          make_latest: true
          files: RitmoAtletismo.apk
